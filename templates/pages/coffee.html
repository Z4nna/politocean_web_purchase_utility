<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generating the BOM</title>

    <link rel="stylesheet" href="/static/css/coffee.css" />
</head>
<body>
    <div id="loading-container">
        <div class="cup">
            <span class="steam"></span>
            <span class="steam"></span>
            <span class="steam"></span>
            <div class="cup-handle"></div>
        </div>
        <br><br>
        <p>Generating BOM... this might take a while😓</p>
        <p>In the meantime, go grab a coffee!</p>
        {% if confirm %}
        <p>The order will be confirmed as soon as the BOM is ready.</p>
        {% endif %}
    </div>

    {% if confirm %}
    <form id="finish-confirm" action="/orders/{{ order_id }}/confirm/finish" method="post" hidden></form>
    {% endif %}

    <script>
        const orderId = {{ order_id }};
        // When confirming an order, a successful generation is followed by the
        // second step (email + state change); a failed one confirms nothing.
        const finishConfirm = document.getElementById("finish-confirm");

        async function pollStatus() {
            console.log("Polling status for order:", orderId);
            try {
                const response = await fetch(`/orders/${orderId}/get_bom_gen_status`);
                const result = await response.json();

                if (result.status === "done") {
                    if (finishConfirm) {
                        finishConfirm.submit();
                    } else {
                        window.location.href = `/orders/${orderId}/edit`;
                    }
                } else if (result.status === "failed") {
                    if (finishConfirm) {
                        alert("❌ BOM generation failed: the order was not confirmed. Please try again later.");
                        window.location.href = "/board/orders";
                    } else {
                        alert("❌ BOM generation failed. Please try again later.");
                    }
                } else {
                    setTimeout(pollStatus, 2000); // Retry after 2 seconds
                }
            } catch (err) {
                console.error("Error checking status:", err);
                setTimeout(pollStatus, 5000); // Retry with backoff
            }
        }

        pollStatus();
    </script>
</body>
</html>
